<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f6f4">
    <title>TimeTrack · Iniciar sesión</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
    <main class="login">
        <img src="/assets/Logo2.webp" alt="TimeTrack" class="login-logo" width="200" height="72">
        <p class="login-sub">Bienvenido</p>

        <form id="login-form" novalidate>
            <div class="form-alert hidden" id="error-message" role="alert"></div>

            <div class="field">
                <label class="field-label" for="username">Usuario</label>
                <input class="input" id="username" name="username" type="text" required
                       autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
            </div>

            <div class="field">
                <label class="field-label" for="password">Contraseña</label>
                <div class="input-wrap">
                    <input class="input" id="password" name="password" type="password" required
                           autocomplete="current-password" inputmode="numeric" enterkeyhint="go">
                    <button type="button" class="icon-btn" id="toggle-pass" aria-label="Mostrar contraseña"></button>
                </div>
            </div>

            <button class="btn btn-primary btn-block" type="submit" id="submit">Iniciar sesión</button>
        </form>
    </main>

    <script type="module" src="/assets/login.js"></script>
</body>
</html>
