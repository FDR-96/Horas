<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F26722">
    <title>TimeTrack · Iniciar sesión</title>
    <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-title" content="TimeTrack">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="login-page">
    <main class="login">
        <section class="login-hero">
            <img src="/assets/icons/icon-white.svg" alt="" class="login-icon" width="84" height="84">
            <h1 class="login-title">TimeTrack</h1>
            <p class="login-tagline">Carga de horas · Albace</p>
        </section>

        <form id="login-form" class="login-card" novalidate>
            <h2>Iniciar sesión</h2>
            <div class="form-alert hidden" id="error-message" role="alert"></div>

            <div class="field">
                <label class="field-label" for="username">Usuario</label>
                <input class="input" id="username" name="username" type="text" required
                       autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
            </div>

            <div class="field">
                <label class="field-label" for="password">Contraseña</label>
                <div class="input-wrap">
                    <input class="input" id="password" name="password" type="password" required
                           autocomplete="current-password" inputmode="numeric" enterkeyhint="go">
                    <button type="button" class="icon-btn" id="toggle-pass" aria-label="Mostrar contraseña"></button>
                </div>
            </div>

            <button class="btn btn-primary btn-block" type="submit" id="submit">Ingresar</button>
        </form>
    </main>

    <script type="module" src="/assets/login.js"></script>
</body>
</html>
