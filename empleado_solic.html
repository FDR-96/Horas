<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f6f4">
    <title>TimeTrack · Cargar horas</title>
    <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-title" content="TimeTrack">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
    <header class="app-header">
        <a class="icon-btn" href="/empleado_dash.html" id="back" aria-label="Volver al inicio"></a>
        <h1>Cargar horas</h1>
    </header>

    <main class="page">
        <form id="form" novalidate>
            <!-- Fecha -->
            <div class="field" id="f-fecha">
                <div class="field-label"><span id="lbl-fecha">Fecha</span></div>
                <div class="chips scroll" id="fechas" role="radiogroup" aria-labelledby="lbl-fecha"></div>
            </div>

            <!-- Obra -->
            <div class="field" id="f-obra">
                <div class="field-label"><span id="lbl-obra">Obra</span></div>
                <button type="button" class="picker empty" id="obra-btn" aria-labelledby="lbl-obra obra-value" aria-haspopup="dialog">
                    <span class="picker-text">
                        <span class="picker-value" id="obra-value">Elegir obra</span>
                        <span class="picker-sub" id="obra-sub"></span>
                    </span>
                    <span data-icon="chevron"></span>
                </button>
                <p class="field-error">Elegí la obra en la que trabajaste.</p>
            </div>

            <!-- Sector -->
            <div class="field" id="f-sector">
                <div class="field-label"><span id="lbl-sector">Sector</span></div>
                <button type="button" class="picker empty" id="sector-btn" aria-labelledby="lbl-sector sector-value" aria-haspopup="dialog">
                    <span class="picker-text"><span class="picker-value" id="sector-value">Elegir sector</span></span>
                    <span data-icon="chevron"></span>
                </button>
                <p class="field-error">Elegí el sector.</p>
            </div>

            <!-- Horas -->
            <div class="field" id="f-horas">
                <div class="field-label"><span id="lbl-horas">Horas</span></div>
                <div class="chips hours" id="horas-rapidas" role="radiogroup" aria-labelledby="lbl-horas"></div>
                <div class="stepper">
                    <button type="button" id="menos" aria-label="Restar 30 minutos"></button>
                    <output id="horas-value" class="empty" aria-live="polite">Elegí o ajustá</output>
                    <button type="button" id="mas" aria-label="Sumar 30 minutos"></button>
                </div>
                <p class="field-error">Indicá cuántas horas trabajaste.</p>
            </div>

            <div class="notice hidden" id="dia-notice"></div>

            <!-- Observaciones -->
            <div class="field" style="margin-top: 22px">
                <label class="field-label" for="razon">Observaciones <span class="opt">Opcional</span></label>
                <input class="input" id="razon" name="razon" type="text" maxlength="255"
                       placeholder="Ej. Proyecto urgente" enterkeyhint="done">
            </div>
        </form>
    </main>

    <div class="action-bar">
        <div class="action-bar-inner">
            <a class="btn btn-secondary" href="/empleado_dash.html">Cancelar</a>
            <button type="submit" form="form" class="btn btn-primary" id="submit">Cargar</button>
        </div>
    </div>

    <script type="module" src="/assets/solic.js"></script>
</body>
</html>
