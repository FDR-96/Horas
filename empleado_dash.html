<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f6f4">
    <title>TimeTrack · Mis horas</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
    <header class="app-header">
        <img src="/assets/tracktime.webp" alt="TimeTrack" class="brand-logo" width="120" height="34">
        <span class="spacer"></span>
        <button type="button" class="icon-btn" id="logout" aria-label="Cerrar sesión"></button>
    </header>

    <main class="page">
        <h1 class="greeting" id="greeting"><span class="skeleton">Hola, usuario</span></h1>

        <section class="today-card" aria-labelledby="today-label">
            <div class="label" id="today-label">Horas trabajadas hoy</div>
            <div class="total" id="today-total"><span class="skeleton">0 h 00 m</span></div>
            <div class="progress" role="progressbar" aria-labelledby="today-label" aria-valuemin="0" id="today-progress">
                <span style="width: 0%"></span>
            </div>
            <p class="hint" id="today-hint">&nbsp;</p>
        </section>

        <div id="entries" aria-live="polite"></div>

        <footer class="brand-footer">
            <img src="/assets/Logo.webp" alt="Albace" width="96" height="28" loading="lazy">
            <img src="/assets/AxuraLogo.png" alt="Axura" width="96" height="28" loading="lazy">
        </footer>
    </main>

    <div class="action-bar">
        <div class="action-bar-inner single">
            <a class="btn btn-primary" href="/empleado_solic.html" id="cargar"></a>
        </div>
    </div>

    <script type="module" src="/assets/dash.js"></script>
</body>
</html>
