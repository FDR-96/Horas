<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f6f4">
    <title>TimeTrack · Mis horas</title>
    <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-title" content="TimeTrack">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <img src="/assets/icons/icon.svg" alt="" class="brand-icon" width="32" height="32">
            <span class="brand-word">Time<b>Track</b></span>
        </div>
        <span class="spacer"></span>
        <button type="button" class="icon-btn" id="logout" aria-label="Cerrar sesión"></button>
    </header>

    <main class="page">
        <h1 class="greeting" id="greeting"><span class="skeleton">Hola, usuario</span></h1>

        <section class="today-card" aria-labelledby="today-label">
            <div class="label" id="today-label">Horas trabajadas hoy</div>
            <div class="total" id="today-total"><span class="skeleton">0 h 00 m</span></div>
            <div class="progress" role="progressbar" aria-labelledby="today-label" aria-valuemin="0" id="today-progress">
                <span style="width: 0%"></span>
            </div>
            <p class="hint" id="today-hint">&nbsp;</p>
        </section>

        <div id="entries" aria-live="polite"></div>
    </main>

    <div class="action-bar">
        <div class="action-bar-inner single">
            <a class="btn btn-primary" href="/empleado_solic.html" id="cargar"></a>
        </div>
    </div>

    <script type="module" src="/assets/dash.js"></script>
</body>
</html>
